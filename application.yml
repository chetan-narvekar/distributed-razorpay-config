spring:
  threads:
    virtual:
      enabled: true
  datasource:
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  kafka:
    listener:
      ack-mode: manual
    bootstrap-servers: ${KAFKA_BROKERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        retries: 3
        spring.json.add.type.headers: false
    consumer:
      group-id: razorpay-monolith
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.app.razorpay.*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true
    hostname: localhost
    
management:
  endpoints:
    web:
      exposure:
        includes: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkins:
    tracing:
      endpoints: http://localhost:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}
        

logging:
  level:
    root: INFO
    com.app.razorpay: DEBUG
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN

app:
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 3

  kafka:
    topics:
      payment: payment.event
      order: order.event
      refund: refund.event
      settlement: settlement.event

payment:
  order:
    default-order-expiry-minutes: 10

  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
        min-delay-seconds: 1
        max-delay-seconds: 3
        success-rate: 95
      NET_BANKING:
        min-delay-seconds: 4
        max-delay-seconds: 10
        success-rate: 80


