server:
  port: 8080

app:
  security:
    public-rotes:
      - "/v1/auth/**"
      - "/webhook/**"
  rate-limit:
    method: fixed
    use-cases:
      api-key:
        requests-per-minutes: 200


spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
           - id: merchant-service
             uri: lb://merchnat-service
             predicates:
               - Path=/v1/auth/**, /v1/merchants/**
           - id: payment-service
             uri: lb://payment-service
             predicates:
               - Path=/v1/orders/**, /v1/payments/**
           - id: vault-service
             uri: lb://vault-service
             predicates:
               - Path=/v1/vault/**
           - id: operations-service
             uri: lb://operations-service
             predicates:
              - Path=/v1/operations/**
