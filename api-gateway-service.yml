server:
  port: 8080

app:
  security:
    trust-inbound-headers: false
    public-routes:
      - "/v1/auth/**"
      - "/webhook/**"
      - "/actuator/health"
      - "/actuator/prometheus"
  rate-limit:
    method: fixed
    use-cases:
      api-key:
        requests-per-minutes: 200
jwt:
  secret-key: a9asd7fulasjdfaklsdfu98q3uhjdiosh897as9d8f7ua9osufdjilasdjf


spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
           - id: merchant-service
             uri: ${MERCHANT_SERVICE_URI:lb://merchant-service}
             predicates:
               - Path=/v1/auth/**, /v1/merchants/**
           - id: payment-service
             uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
             predicates:
               - Path=/v1/orders/**, /v1/payments/**
           - id: vault-service
             uri: ${VAULT_SERVICE_URI:lb://vault-service}
             predicates:
               - Path=/v1/vault/**
           - id: operations-service
             uri: ${OPERATIONS_SERVICE_URI:lb://operations-service}
             predicates:
              - Path=/v1/operations/**


---

spring:
  config:
    activate:
      on-profile: k8s

jwt:
  secret-key: ${JWT_SECRET}